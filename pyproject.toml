[project]
name = "taskmanager"
version = "0.6.3"
description = "Приложение помогающее вести заявки"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyside6==6.8.1.1",
    "openpyxl>=3.1",
]

[project.scripts]
taskmanager = "taskmanager.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taskmanager"]

[tool.hatch.build.targets.wheel.force-include]
"src/taskmanager/ui/styles/app.qss" = "taskmanager/ui/styles/app.qss"
"src/taskmanager/ui/styles/app_dark.qss" = "taskmanager/ui/styles/app_dark.qss"
"src/taskmanager/resources/app_icon.png" = "taskmanager/resources/app_icon.png"
"src/taskmanager/resources/app_icon.ico" = "taskmanager/resources/app_icon.ico"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pyinstaller>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
