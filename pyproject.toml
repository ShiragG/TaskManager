[project]
name = "taskmanager"
version = "0.1.0"
description = "Приложение помогающее вести заявки"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyside6==6.8.1.1",
]

[project.scripts]
taskmanager = "taskmanager.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taskmanager"]

[tool.hatch.build.targets.wheel.force-include]
"src/taskmanager/ui/styles/app.qss" = "taskmanager/ui/styles/app.qss"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
